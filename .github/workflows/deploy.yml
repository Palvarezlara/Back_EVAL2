name: ci-cd pipeline

# se ejecuta cuando hago push a la rama deploy
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # paso 1 - bajar el codigo
      - name: checkout
        uses: actions/checkout@v4

      # paso 2 - hacer login en dockerhub
      - name: login dockerhub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # paso 3 - construir la imagen
      - name: build imagen
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-eval2:latest .

      # paso 4 - subir la imagen a dockerhub
      - name: push imagen
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-eval2:latest

      # paso 5 - conectarse a la ec2 privada usando el front como bastion (jump host)
      # proxy_host = ec2 publica del front, host = ec2 privada del back
      - name: deploy en ec2 privada
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACK_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_BACK_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_FRONT_SSH_KEY }}
          script: |
            # bajar la imagen nueva (requiere NAT Gateway en subnet privada)
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-eval2:latest

            # eliminar el contenedor viejo sin importar su estado
            docker rm -f back-eval2 || true

            # liberar el puerto 3000 si otro contenedor lo esta usando
            docker ps -q --filter publish=3000 | xargs -r docker rm -f

            # correr el contenedor nuevo
            docker run -d \
              --name back-eval2 \
              --restart always \
              -p 3000:3000 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_PORT=3306 \
              ${{ secrets.DOCKERHUB_USERNAME }}/back-eval2:latest
